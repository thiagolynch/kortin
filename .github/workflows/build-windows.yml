name: Gerar .exe para Windows

on:
  # Todo envio para a main gera o .exe. Se a versão do package.json for nova,
  # publica em "Releases" (e o app instalado se atualiza sozinho).
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  # Permite rodar manualmente pela aba "Actions"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Ler a versão e ver se já foi publicada
        id: v
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "A versão $VER já existe: este build não será publicado."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Versão nova: $VER será publicada em Releases."
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Reaproveitar a IA de legenda já compilada
        uses: actions/cache@v4
        with:
          path: |
            vendor/whisper
            vendor-src
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/build-whisper.mjs') }}

      - name: Compilar a IA de legenda (whisper.cpp)
        shell: bash
        run: |
          if [ ! -f vendor/whisper/win/fast/whisper-cli.exe ]; then npm run setup:whisper; fi

      - name: Auditoria de dependências de produção (falha em vulnerabilidade alta)
        run: npm audit --omit=dev --audit-level=high

      - name: Testes de unidade e propriedade (timeline, legendas, segurança, FFmpeg)
        run: npm run test:unit

      - name: Testar o motor de vídeo
        run: npm run test:engine

      - name: Reaproveitar os modelos já conferidos
        uses: actions/cache@v4
        with:
          path: vendor-src/models-verify
          key: models-${{ hashFiles('electron/services/stt/transcribe.js') }}

      - name: Conferir SHA-256 dos modelos de IA contra o servidor
        run: npm run verify:models

      - name: Testar a legenda de ponta a ponta
        run: npm run test:whisper

      - name: Gerar o instalador e a versão portátil
        run: npm run dist

      - name: Guardar os .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kortin-Windows-${{ steps.v.outputs.version }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap

      - name: Notas da versão (seção do CHANGELOG)
        shell: bash
        run: |
          VER="${{ steps.v.outputs.version }}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Versão $VER." > release-notes.md; fi
          cat release-notes.md

      - name: Publicar na página de Releases
        if: steps.v.outputs.new == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Kortin ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          # latest.yml e .blockmap permitem que o app instalado se atualize sozinho
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          body_path: release-notes.md
          generate_release_notes: true
