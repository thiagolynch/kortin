name: Gerar .exe para Windows

on:
  # Ao criar uma tag v0.1.0, v0.2.0... gera o .exe e publica em "Releases"
  push:
    tags: ['v*']
  # Permite rodar manualmente pela aba "Actions"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Reaproveitar a IA de legenda já compilada
        uses: actions/cache@v4
        with:
          path: |
            vendor/whisper
            vendor-src
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/build-whisper.mjs') }}

      - name: Compilar a IA de legenda (whisper.cpp)
        shell: bash
        run: |
          if [ ! -f vendor/whisper/win/fast/whisper-cli.exe ]; then npm run setup:whisper; fi

      - name: Testar o motor de vídeo
        run: npm run test:engine

      - name: Testar a legenda de ponta a ponta
        run: npm run test:whisper

      - name: Gerar o instalador e a versão portátil
        run: npm run dist

      - name: Guardar os .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kortin-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml e .blockmap permitem que o app instalado se atualize sozinho
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true
